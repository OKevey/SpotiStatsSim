<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Stats Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Base styles */
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.3s ease; overflow: hidden; }
        
        /* Sidebar Styling */
        .export-btn { 
            width: 100%; text-align: left; padding: 10px; border-radius: 12px;
            font-size: 11px; font-weight: 800; text-transform: uppercase;
            background: #f8fafc; color: #64748b; border: 1px solid #e2e8f0;
            margin-bottom: 8px; cursor: pointer; transition: all 0.2s;
        }
        .export-btn:hover { background: #3b82f6; color: white; border-color: #3b82f6; }
        
        /* Dark Mode Theme Overrides */
        body.dark-mode { background-color: #0f172a; color: #f8fafc; }
        .dark-mode main { background-color: #0f172a; } /* Fix for the background issue */
        .dark-mode aside { background-color: #1e293b; border-color: #334155; }
        .dark-mode .bg-white { background-color: #1e293b; border-color: #334155; color: white; }
        .dark-mode input { background-color: #334155; color: white; border-color: #475569; }
        .dark-mode .export-btn { background-color: #334155; color: #94a3b8; border-color: #475569; }

        /* Custom scrollbar */
        aside::-webkit-scrollbar { width: 5px; }
        aside::-webkit-scrollbar-track { background: transparent; }
        aside::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .dark-mode aside::-webkit-scrollbar-thumb { background: #334155; }
    </style>
</head>
<body class="bg-[#F9FBFF] text-slate-900">

    <div class="flex flex-col lg:flex-row h-screen w-screen overflow-hidden">
        
        <aside class="w-full lg:w-80 h-full bg-white border-r border-slate-100 p-8 space-y-6 z-10 overflow-y-auto">
            <div class="flex flex-col gap-2">
                <h2 class="text-[18px] font-black uppercase tracking-tight text-blue-500 mb-4">🌐 ARTIST STATS SIMULATOR</h2>
                <h2 class="text-[10px] font-black uppercase tracking-[0.2em] text-blue-500">🖌️ Ui Style</h2>
                <div class="flex gap-2">
                    <button id="darkmodeBtn" onclick="toggleDarkMode()" class="flex-1 text-[10px] text-white-500 bg-slate-100 dark:bg-slate-700 p-2 rounded-lg text-white font-bold" >🌓 Mode</button>
                    <button id="gridToggleBtn" onclick="toggleGrid()" class="flex-1 text-[10px] bg-blue-100 text-blue-600 p-2 rounded-lg font-bold">📏 Grid: ON</button>
                </div>
            </div>
            
            <div class="space-y-4">
                <div>
                    <h2 class="text-[10px] font-black uppercase tracking-[0.1em] text-blue-500 mb-2">👤 Artist Name</h2>
                    <input type="text" id="artistInput" placeholder="Artist Name" oninput="updateUI()" class="w-full border rounded-lg p-2 outline-none text-sm">
                </div>
                <div>
                    <h2 class="text-[10px] font-black uppercase tracking-[0.1em] text-blue-500 mb-2">📢 Streams</h2>
                    <input type="number" id="streamsInput" placeholder="e.g: 10000 (don't use '.' or ',')" oninput="updateUI()" class="w-full border rounded-lg p-2 outline-none text-sm">
                </div>
                <div>
                    <h2 class="text-[10px] font-black uppercase tracking-[0.1em] text-blue-500 mb-2">🎶 Listeners</h2>
                    <input type="number" id="listenersInput" placeholder="e.g: 10000 (don't use '.' or ',')" oninput="updateUI()" class="w-full border rounded-lg p-2 outline-none text-sm">
                </div>
                <div>
                    <h2 class="text-[10px] font-black uppercase tracking-[0.1em] text-blue-500 mb-2">🎨 Color</h2>
                    <input type="color" id="colorInput" value="#3b82f6" oninput="updateUI()" class="w-full h-10 rounded-lg cursor-pointer">
                </div>
            </div>

            <hr class="opacity-20">

            <h2 class="text-[10px] font-bold text-slate-400 uppercase">Export</h2>
            <button onclick="exportBox('captureArea', 'full-dashboard')" class="export-btn bg-blue-600 text-white border-blue-800">🖼️ Full Dashboard</button>
            <button onclick="exportBox('graphFull', 'graph-with-details')" class="export-btn text-black-500 mb-2">📊 Graph + Details</button>
            <button onclick="exportBox('listenersCard', 'listeners-box')" class="export-btn text-black-500 mb-2">🎶 Listeners Box</button>
            <button onclick="exportBox('streamsCard', 'streams-box')" class="export-btn text-black-500 mb-2">📢 Streams Box</button>
            <button onclick="exportPureGraph()" class="export-btn">📈 Pure Graph Only</button>

            <hr class="opacity-20">

            <h2 class="text-[12px] font-black uppercase tracking-[0.1em] text-blue-800 mb-4">📊 Sliders</h2>
            <div id="slidersContainer" class="space-y-4 pb-10"></div>
        </aside>

        <main class="flex-1 p-12 overflow-y-auto bg-[#F9FBFF] transition-colors duration-300">
            <div class="max-w-4xl mx-auto p-6 rounded-[3rem]" id="captureArea">
                <header class="mb-10">
                    <h1 id="artistDisplay" class="text-5xl font-black tracking-tight mb-2">Artist Name</h1>
                </header>

                <div class="grid grid-cols-2 gap-6 mb-10">
                    <div id="streamsCard" class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                        <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">Total Streams</p>
                        <h2 id="streamsDisplay" class="text-4xl font-black tracking-tighter">0</h2>
                    </div>
                    <div id="listenersCard" class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                        <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">Listeners</p>
                        <h2 id="listenersDisplay" class="text-4xl font-black tracking-tighter">0</h2>
                    </div>
                </div>

                <div id="graphFull" class="bg-white p-8 rounded-[2.5rem] shadow-xl shadow-blue-900/5 border border-white">
                    <h3 class="font-bold mb-6">Streams Growth</h3>
                    <div class="h-[350px] w-full">
                        <canvas id="statsChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let isDarkMode = false;
        let showGrid = true;
        let graphData = [15000, 32000, 28000, 45000, 68000, 57945];
        let labels = ['W1', 'W2', 'W3', 'W4', 'W5', 'Today'];
        
        const ctx = document.getElementById('statsChart').getContext('2d');
        const myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    data: graphData,
                    borderColor: '#3b82f6',
                    borderWidth: 5,
                    tension: 0.4,
                    fill: true,
                    pointRadius: (ctx) => (ctx.dataIndex === ctx.dataset.data.length - 1 ? 8 : 0),
                    pointBackgroundColor: '#3b82f6',
                    pointBorderColor: '#ffffff',
                    pointBorderWidth: 4,
                    backgroundColor: (ctx) => {
                        const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 400);
                        g.addColorStop(0, ctx.dataset.borderColor + '44');
                        g.addColorStop(1, 'rgba(255,255,255,0)');
                        return g;
                    }
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { weight: '600' } } },
                    y: { 
                        display: true,
                        grid: { color: '#e2e8f0', drawBorder: false },
                        ticks: {
                            color: '#94a3b8',
                            font: { weight: '600', size: 10 },
                            callback: (val) => val >= 1000 ? (val/1000) + 'k' : val
                        }
                    }
                }
            }
        });

        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode');
            const btn = document.getElementById('darkmodeBtn');
            btn.className = isDarkMode ? "flex-1 text-[10px] text-white-500 bg-slate-100 dark:bg-white-700 p-2 rounded-lg text-slate-500 font-bold": "flex-1 text-[10px] text-white-500 bg-slate-100 dark:bg-slate-700 p-2 rounded-lg text-white font-bold";
            // Update the chart scales to match the mode
            myChart.options.scales.x.ticks.color = isDarkMode ? '#64748b' : '#94a3b8';
            myChart.options.scales.y.ticks.color = isDarkMode ? '#64748b' : '#94a3b8';
            myChart.options.scales.y.grid.color = isDarkMode ? '#334155' : '#e2e8f0';
            myChart.update();
        }

        function toggleGrid() {
            showGrid = !showGrid;
            const btn = document.getElementById('gridToggleBtn');
            myChart.options.scales.y.display = showGrid;
            btn.innerText = showGrid ? "📏 Grid: ON" : "📏 Grid: OFF";
            btn.className = showGrid ? "flex-1 text-[10px] bg-blue-100 text-blue-600 p-2 rounded-lg font-bold" : "flex-1 text-[10px] bg-slate-100 text-slate-500 p-2 rounded-lg font-bold";
            myChart.update();
        }

        function updateUI() {
            const color = document.getElementById('colorInput').value;
            const artist = document.getElementById('artistInput').value || "Artist Name";
            const streams = document.getElementById('streamsInput').value || 0;
            const listeners = document.getElementById('listenersInput').value || 0;

            document.getElementById('artistDisplay').innerText = artist;
            document.getElementById('streamsDisplay').innerText = Number(streams).toLocaleString();
            document.getElementById('listenersDisplay').innerText = Number(listeners).toLocaleString();
            
            myChart.data.datasets[0].borderColor = color;
            myChart.data.datasets[0].pointBackgroundColor = color;
            myChart.update();
        }

        async function exportBox(id, name) {
            const el = document.getElementById(id);
            const canvas = await html2canvas(el, { 
                backgroundColor: isDarkMode ? '#0f172a' : '#F9FBFF', // Ensures export background matches the UI
                scale: 3, 
                useCORS: true 
            });
            save(canvas, name);
        }

        async function exportPureGraph() {
            const oldX = myChart.options.scales.x.display;
            const oldY = myChart.options.scales.y.display;
            myChart.options.scales.x.display = false;
            myChart.options.scales.y.display = false;
            myChart.update('none');
            const canvas = await html2canvas(document.getElementById('statsChart'), { backgroundColor: null, scale: 3 });
            myChart.options.scales.x.display = oldX;
            myChart.options.scales.y.display = oldY;
            myChart.update('none');
            save(canvas, 'pure-graph');
        }

        function save(canvas, name) {
            const link = document.createElement('a');
            link.download = name + '.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        }

        // Generate Sliders
        const container = document.getElementById('slidersContainer');
        graphData.forEach((val, i) => {
            const wrapper = document.createElement('div');
            wrapper.className = "flex flex-col gap-1";
            wrapper.innerHTML = `
                <div class="flex justify-between text-[10px] font-bold text-slate-400"><span>${labels[i]}</span></div>
                <input type="range" min="0" max="150000" value="${val}" class="w-full h-1 bg-slate-100 rounded-lg appearance-none accent-blue-600 cursor-pointer" oninput="updateGraphPoint(${i}, this.value)">
            `;
            container.appendChild(wrapper);
        });

        function updateGraphPoint(i, v) {
            myChart.data.datasets[0].data[i] = v;
            myChart.update('none');
        }

        updateUI();
    </script>
</body>
</html>
